{% extends 'adopciones/base.html' %}

{% block title %}Buscar Animales - Veterinaria Patitas{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold text-success">🔍 Buscar Animales</h2>
        <p class="text-muted mb-0">Filtra por especie en tiempo real</p>
    </div>
    <a href="{% url 'adopciones:animal_create' %}" class="btn btn-success">
        <i class="bi bi-plus-circle"></i> Registrar Animal
    </a>
</div>

<!-- FILTROS -->
<div class="card mb-4 p-3">
    <div class="row g-2 align-items-center">
        <div class="col-md-4">
            <label class="fw-semibold mb-1"><i class="bi bi-funnel"></i> Especie</label>
            <select id="filtroEspecie" class="form-select">
                <option value="">Todos</option>
                <option value="Perro">🐶 Perro</option>
                <option value="Gato">🐱 Gato</option>
                <option value="Ave">🐦 Ave</option>
                <option value="Conejo">🐰 Conejo</option>
                <option value="Otro">🐾 Otro</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="fw-semibold mb-1"><i class="bi bi-heart"></i> Estado</label>
            <select id="filtroEstado" class="form-select">
                <option value="">Todos</option>
                <option value="disponible">✅ Disponible</option>
                <option value="adoptado">🏠 Adoptado</option>
                <option value="en_tratamiento">🏥 En tratamiento</option>
            </select>
        </div>
        <div class="col-md-4 d-flex align-items-end gap-2">
            <button onclick="cargarAnimales()" class="btn btn-success w-100">
                <i class="bi bi-search"></i> Buscar
            </button>
            <button onclick="limpiarFiltros()" class="btn btn-outline-secondary w-100">
                <i class="bi bi-x"></i> Limpiar
            </button>
        </div>
    </div>
</div>

<!-- CONTADOR -->
<p class="text-muted mb-3" id="contador"></p>

<!-- RESULTADO -->
<div id="resultado" class="row g-4"></div>

<!-- LOADING -->
<div id="loading" class="text-center py-5 d-none">
    <div class="spinner-border text-success" role="status"></div>
    <p class="text-muted mt-2">Buscando animales...</p>
</div>

<script>
function cargarAnimales() {
    const especie = document.getElementById('filtroEspecie').value;
    const estado = document.getElementById('filtroEstado').value;
    const contenedor = document.getElementById('resultado');
    const loading = document.getElementById('loading');
    const contador = document.getElementById('contador');

    contenedor.innerHTML = '';
    loading.classList.remove('d-none');

    fetch('/adopciones/api/')
        .then(response => response.json())
        .then(data => {
            loading.classList.add('d-none');

            // Filtrar
            if (especie) data = data.filter(a => a.especie === especie);
            if (estado) data = data.filter(a => a.estado === estado);

            contador.textContent = `Se encontraron ${data.length} animal(es)`;

            if (data.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <span style="font-size:60px">🐾</span>
                        <p class="text-muted mt-3">No se encontraron animales con esos filtros.</p>
                    </div>`;
                return;
            }

            data.forEach(animal => {
                const badgeColor = animal.estado === 'disponible' ? 'success' :
                                   animal.estado === 'adoptado' ? 'primary' : 'warning';
                const badgeText = animal.estado === 'disponible' ? '✅ Disponible' :
                                  animal.estado === 'adoptado' ? '🏠 Adoptado' : '🏥 En tratamiento';

                contenedor.innerHTML += `
                    <div class="col-md-4">
                        <div class="card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="fw-bold text-success mb-0">${animal.nombre}</h5>
                                    <span class="badge bg-${badgeColor}">${badgeText}</span>
                                </div>
                                <p class="text-muted small mb-1">
                                    <i class="bi bi-tag"></i> ${animal.especie} — ${animal.raza}
                                </p>
                                <p class="text-muted small mb-2">
                                    <i class="bi bi-calendar"></i> ${animal.edad} año(s)
                                </p>
                                <p class="small">${animal.descripcion.substring(0, 80)}...</p>
                            </div>
                            <div class="card-footer bg-white border-0 pb-3">
                                <a href="/adopciones/${animal.id}/" class="btn btn-success btn-sm w-100">
                                    <i class="bi bi-eye"></i> Ver detalle
                                </a>
                            </div>
                        </div>
                    </div>`;
            });
        })
        .catch(() => {
            loading.classList.add('d-none');
            contenedor.innerHTML = `
                <div class="col-12 text-center py-4">
                    <p class="text-danger">❌ Error al cargar los animales. Intenta de nuevo.</p>
                </div>`;
        });
}

function limpiarFiltros() {
    document.getElementById('filtroEspecie').value = '';
    document.getElementById('filtroEstado').value = '';
    cargarAnimales();
}

// Cargar al inicio
cargarAnimales();

// Cargar automático al cambiar filtros
document.getElementById('filtroEspecie').addEventListener('change', cargarAnimales);
document.getElementById('filtroEstado').addEventListener('change', cargarAnimales);
</script>

{% endblock %}
